<div class="posts content-list">
    {% for post in site.data.all_posts %}
    <div class="all-post kind-{{ post.kind }}" onclick="if (!event.target.closest('a')) window.open('{{ post.url }}', '_blank')">
        <div class="title"><a class="card-link" href="{{ post.url }}" target="_blank" rel="noopener">{{ post.title }}</a></div>
        <div class="posted-at">{{ post.timestamp | date: "%b %d %Y" }}</div>
        <div class="post-content">{{ post.html }}</div>
    </div>
    {% endfor %}
</div>
