<div class="ctf-problem-list content-list">
    {% for problem in site.data.ctf_problems %}
    <div class="ctf-problem" onclick="if (!event.target.closest('a')) window.open('{{ problem.link }}', '_blank')">
        <div class="background" style="background-image: url({{ problem.image }})"></div>
        <div class="problem-title"><a class="card-link" href="{{ problem.link }}" target="_blank" rel="noopener">{{ problem.name }}</a></div>
        <div class="competition">{{ problem.competition }}</div>
        <div class="categories">
            {% for category in problem.categories %}
            <div class="category">{{ category }}</div>
            {% endfor %}
        </div>
    </div>
    {% endfor %}
</div>
